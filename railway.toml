# railway.toml na raiz do repositório
# Guia o Railway automaticamente para a pasta projeto/meroe-platform

[build]
builder = "DOCKERFILE"
dockerfilePath = "projeto/meroe-platform/Dockerfile"

[deploy]
startCommand = "node src/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "meroe-api"
