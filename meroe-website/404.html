<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Página não encontrada — MEROE</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{--azul:#0A1628;--ouro:#C9820A;--branco:#F0F4FA;--cinza:#8A97AA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:var(--azul);color:var(--branco);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
.num{font-family:'Barlow Condensed',sans-serif;font-size:8rem;font-weight:800;color:var(--ouro);line-height:1;opacity:.3}
h1{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:1rem 0 .5rem}
p{font-size:.95rem;font-weight:300;color:var(--cinza);margin-bottom:2.5rem}
.btn{display:inline-block;font-size:.8rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;background:var(--ouro);color:#060D18;padding:.8rem 2rem;border-radius:2px;text-decoration:none;transition:background .3s}
.btn:hover{background:#E8A020}
</style>
</head>
<body>
  <div class="num">404</div>
  <h1>Página não encontrada</h1>
  <p>A página que procura não existe ou foi movida.</p>
  <a href="/" class="btn">← Voltar ao Website</a>
  <div style="margin-top:2rem;font-size:.8rem;color:var(--cinza)">
    <p style="margin-bottom:.8rem">Pode estar à procura de:</p>
    <a href="/#servicos" style="color:var(--ouro);margin:0 .8rem">Serviços</a>
    <a href="/#contacto" style="color:var(--ouro);margin:0 .8rem">Contacto</a>
    <a href="/plataforma" style="color:var(--ouro);margin:0 .8rem">Plataforma</a>
  </div>
</body>
</html>
