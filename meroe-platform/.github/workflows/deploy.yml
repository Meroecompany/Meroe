# .github/workflows/deploy.yml
# Deploy automático: push para main → website no Vercel + backend no Railway

name: MEROE Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Testes e lint ─────────────────────────────────────
  test:
    name: Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meroe-platform
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: meroe-platform/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Testes
        run: npm test --if-present
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          JWT_SECRET: test_secret_at_least_64_chars_long_for_github_actions_ci
          REFRESH_TOKEN_SECRET: test_refresh_secret_64_chars_long_for_github_actions_ci

  # ── JOB 2: Deploy Website (Vercel) ───────────────────────────
  deploy-website:
    name: Deploy Website → Vercel
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy no Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: meroe-website
          vercel-args: '--prod'

  # ── JOB 3: Deploy Backend (Railway) ──────────────────────────
  deploy-backend:
    name: Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy no Railway
        run: railway up --service meroe-api
        working-directory: meroe-platform
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
