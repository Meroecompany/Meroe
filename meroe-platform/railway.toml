# railway.toml — configuração de deploy no Railway (gratuito)
# railway.app — cria conta, liga o GitHub, e o deploy é automático

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node src/server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "meroe-api"
