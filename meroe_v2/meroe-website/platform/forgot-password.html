<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Recuperar Password — MEROE Digital</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230A1628'/><text y='.9em' font-size='60' font-family='Arial' font-weight='900' fill='%23C9820A' x='50' text-anchor='middle' dominant-baseline='middle' dy='0.05em'>M</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="platform.css"/>
<style>
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem 5%;min-height:100vh}
.top-nav{position:fixed;top:1rem;left:1rem;z-index:50}
.card{background:var(--azul-mid);border:1px solid rgba(201,130,10,.2);border-radius:10px;padding:2.5rem;width:100%;max-width:420px;position:relative}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--ouro),var(--ouro-clr),transparent);border-radius:10px 10px 0 0}
.logo{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:800;text-align:center;margin-bottom:.3rem}
.logo-sub{font-size:.6rem;letter-spacing:.28em;color:var(--ouro);text-transform:uppercase;text-align:center;margin-bottom:2rem;font-weight:300}
h1{font-family:'Barlow Condensed',sans-serif;font-size:1.4rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem;text-align:center}
.subtitle{font-size:.85rem;color:var(--cinza);text-align:center;margin-bottom:2rem;line-height:1.6}
.pass-strength{height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:.4rem;overflow:hidden}
.pass-fill{height:100%;border-radius:2px;transition:all var(--trans);width:0}
.reset-section{display:none}
</style>
</head>
<body>
<div class="top-nav">
  <a href="login.html" class="nav-back" aria-label="Voltar ao login">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Login
  </a>
</div>
<div class="card" role="main">
  <div class="logo">MEROE</div>
  <div class="logo-sub">Plataforma de Talentos</div>
  <div id="requestSection">
    <h1>Recuperar password</h1>
    <p class="subtitle">Introduza o seu email e enviaremos um link para redefinir a sua password.</p>
    <div class="alert alert-err" id="reqErr" role="alert" aria-live="assertive"><span>⚠</span><span id="reqErrMsg"></span></div>
    <div class="alert alert-ok"  id="reqOk"  role="status" aria-live="polite"><span>✓</span><span id="reqOkMsg"></span></div>
    <div class="field">
      <label for="resetEmail">Email da sua conta</label>
      <input type="email" id="resetEmail" autocomplete="email" maxlength="255" placeholder="seu@email.com" required/>
    </div>
    <button class="btn btn-primary btn-full" id="requestBtn" onclick="sendReset()" style="margin-top:.5rem">Enviar link de recuperação</button>
    <a href="login.html" style="display:block;text-align:center;margin-top:1.5rem;font-size:.82rem;color:var(--cinza)">← Voltar ao login</a>
  </div>
  <div id="resetSection" class="reset-section">
    <h1>Nova password</h1>
    <p class="subtitle">Escolha uma nova password segura para a sua conta.</p>
    <div class="alert alert-err" id="resetErr" role="alert" aria-live="assertive"><span>⚠</span><span id="resetErrMsg"></span></div>
    <div class="alert alert-ok"  id="resetOk"  role="status" aria-live="polite"><span>✓</span><span id="resetOkMsg"></span></div>
    <div class="field">
      <label for="newPassword">Nova password</label>
      <input type="password" id="newPassword" autocomplete="new-password" maxlength="128" placeholder="Mínimo 8 caracteres"/>
      <div class="pass-strength"><div class="pass-fill" id="pFill"></div></div>
      <small id="pHint" style="font-size:.72rem;color:var(--cinza)">Use maiúsculas, minúsculas, números e símbolos</small>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirmar nova password</label>
      <input type="password" id="confirmPassword" autocomplete="new-password" maxlength="128" placeholder="Repetir password"/>
    </div>
    <button class="btn btn-primary btn-full" id="resetBtn" onclick="doReset()" style="margin-top:.5rem">Redefinir password</button>
  </div>
</div>
<script>
const API=(location.hostname==='localhost'||location.hostname.includes('127'))?'http://localhost:4000/api':'/api';
const params=new URLSearchParams(location.search);
const token=params.get('token');
if(token){document.getElementById('requestSection').style.display='none';document.getElementById('resetSection').style.display='';}
document.getElementById('newPassword')?.addEventListener('input',function(){
  const v=this.value;let s=0;
  if(v.length>=8)s++;if(v.length>=12)s++;if(/[A-Z]/.test(v))s++;if(/[a-z]/.test(v))s++;if(/\d/.test(v))s++;if(/[^A-Za-z0-9]/.test(v))s++;
  const f=document.getElementById('pFill'),h=document.getElementById('pHint');
  f.style.width=Math.round(s/6*100)+'%';f.style.background=s<3?'#E05252':s<5?'#EF9F27':'#1A9E75';
  h.textContent=s<3?'Fraca':s<5?'Razoável':'Forte ✓';h.style.color=f.style.background;
});
async function sendReset(){
  const email=document.getElementById('resetEmail').value.trim();
  const btn=document.getElementById('requestBtn');
  document.getElementById('reqErr').classList.remove('show');document.getElementById('reqOk').classList.remove('show');
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){document.getElementById('reqErrMsg').textContent='Email inválido.';document.getElementById('reqErr').classList.add('show');return;}
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> A enviar...';
  try{
    const r=await fetch(`${API}/auth/forgot-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json();
    document.getElementById('reqOkMsg').textContent=d.message||'Se o email existir, receberá as instruções.';
    document.getElementById('reqOk').classList.add('show');btn.textContent='Email enviado ✓';
  }catch{document.getElementById('reqErrMsg').textContent='Erro de ligação. Tente novamente.';document.getElementById('reqErr').classList.add('show');btn.disabled=false;btn.textContent='Enviar link de recuperação';}
}
async function doReset(){
  const newPass=document.getElementById('newPassword').value;
  const confPass=document.getElementById('confirmPassword').value;
  const btn=document.getElementById('resetBtn');
  document.getElementById('resetErr').classList.remove('show');document.getElementById('resetOk').classList.remove('show');
  const pOk=newPass.length>=8&&/[A-Z]/.test(newPass)&&/[a-z]/.test(newPass)&&/\d/.test(newPass)&&/[^A-Za-z0-9]/.test(newPass);
  if(!pOk){document.getElementById('resetErrMsg').textContent='Password deve ter min. 8 char com maiúsculas, minúsculas, números e símbolo.';document.getElementById('resetErr').classList.add('show');return;}
  if(newPass!==confPass){document.getElementById('resetErrMsg').textContent='Passwords não coincidem.';document.getElementById('resetErr').classList.add('show');return;}
  btn.disabled=true;btn.innerHTML='<span class="spinner"></span> A redefinir...';
  try{
    const r=await fetch(`${API}/auth/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:newPass})});
    const d=await r.json();
    if(!r.ok){document.getElementById('resetErrMsg').textContent=d.error||'Link inválido ou expirado.';document.getElementById('resetErr').classList.add('show');btn.disabled=false;btn.textContent='Redefinir password';return;}
    document.getElementById('resetOkMsg').textContent='Password redefinida! A redirecionar...';document.getElementById('resetOk').classList.add('show');btn.textContent='Redefinido ✓';
    setTimeout(()=>{window.location.href='login.html?reset=1';},2000);
  }catch{document.getElementById('resetErrMsg').textContent='Erro de ligação.';document.getElementById('resetErr').classList.add('show');btn.disabled=false;btn.textContent='Redefinir password';}
}
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(token)doReset();else sendReset();});
</script>
</body>
</html>
